name: SOUP Version Drift Check
on:
  push:
    branches: [main, develop, 'phase-*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version_drift:
    name: SOUP Version Drift Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run version-drift with recorded policy and raw results
        run: python3 scripts/run_coherence.py version-drift -- --no-color --verbose --no-matrix

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: version-drift-results
          path: coherence-results/
          if-no-files-found: error
