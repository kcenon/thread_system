name: Tag Reality
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to validate
        required: true
        type: string
      release_commit:
        description: Independently recorded release merge SHA (otherwise resolve a release PR)
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  pull-requests: read
jobs:
  tag-reality:
    name: Tag identity and port archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate release identity and stored port checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: >-
          python3 scripts/run_coherence.py tag-reality --
          --repo kcenon/thread_system --tag "$RELEASE_TAG"
          --release-commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tag-reality-results
          path: coherence-results/
          if-no-files-found: error
